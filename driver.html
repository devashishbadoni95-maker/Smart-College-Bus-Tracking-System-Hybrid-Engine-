<!DOCTYPE html>
<html>
<head>
    <title>Driver Panel - Live Tracking</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { text-align: center; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 0; }
        .login-card { max-width: 400px; margin: 20px auto; padding: 30px; border-radius: 20px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .icon-circle { font-size: 50px; margin-bottom: 10px; }
        .status-container {
            margin: 20px auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 1px solid #eee;
        }
        .btn-start { background: #27ae60; color: white; padding: 18px; border: none; border-radius: 12px; cursor: pointer; font-size: 20px; font-weight: bold; width: 100%; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); }
        .btn-stop { background: #e74c3c; color: white; padding: 18px; border: none; border-radius: 12px; cursor: pointer; font-size: 20px; font-weight: bold; width: 100%; display: none; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3); }
        #live-status { font-weight: bold; color: #2c3e50; margin: 10px 0; }
        .pulse {
            height: 12px; width: 12px; background-color: #27ae60;
            border-radius: 50%; display: inline-block;
            margin-right: 10px; animation: blink 1s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .logout-btn { background: #95a5a6; color: white; margin-top: 20px; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 14px; }
        #error-log { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; background: #fdf2f2; padding: 10px; border-radius: 5px; }
        #debug-info { font-size: 11px; color: #95a5a6; margin-top: 15px; }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="icon-circle">🚌</div>
        <h2>Bus Driver Panel</h2>
        
        <div class="status-container">
            <p id="live-status">Connecting to Server...</p>
            <div id="active-indicator" style="display:none;"><span class="pulse"></span>Sharing Live Location</div>
            <p id="error-log"></p>
        </div>

        <button id="startBtn" class="btn-start" onclick="toggleTracking(true)">START TRIP</button>
        <button id="stopBtn" class="btn-stop" onclick="toggleTracking(false)">END TRIP</button>
        
        <div id="debug-info">Last Sent: <span id="last-coords">None</span></div>

        <button class="logout-btn" onclick="logout()">Logout Account</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    // 1. Security Check
    if (localStorage.getItem("driverLogin") !== "true") {
        window.location.replace("driverlogin.html");
    }

    // 2. Socket Connection (Uses current host/IP automatically)
    const socket = io(); 

    let watchId = null;

    socket.on('connect', () => {
        document.getElementById("live-status").innerText = "Connected & Ready ✅";
        document.getElementById("live-status").style.color = "#27ae60";
    });

    socket.on('disconnect', () => {
        document.getElementById("live-status").innerText = "Connection Lost ❌";
        document.getElementById("live-status").style.color = "#e74c3c";
    });

    // 3. Tracking Logic
    function toggleTracking(status) {
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const liveStatus = document.getElementById("live-status");
        const activeIndicator = document.getElementById("active-indicator");
        const errorLog = document.getElementById("error-log");

        if (status) {
            if ("geolocation" in navigator) {
                liveStatus.innerText = "Activating GPS...";
                startBtn.style.display = "none";
                stopBtn.style.display = "block";

                // Watch Position for real-time tracking
                watchId = navigator.geolocation.watchPosition(
                    pos => {
                        const coords = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            busId: "COLLEGE-BUS-01",
                            timestamp: new Date().toLocaleTimeString()
                        };
                        
                        // Emit to server
                        socket.emit("bus-moved", coords); 
                        
                        // UI Update
                        liveStatus.innerText = "Trip is LIVE 🛰️";
                        document.getElementById("last-coords").innerText = 
                            coords.lat.toFixed(5) + ", " + coords.lng.toFixed(5);
                        activeIndicator.style.display = "block";
                        errorLog.style.display = "none";
                        console.log("Location Shared:", coords);
                    },
                    err => {
                        console.error("GPS Error:", err);
                        errorLog.style.display = "block";
                        activeIndicator.style.display = "none";
                        
                        if(err.code === 1) errorLog.innerText = "❌ Permission Denied! Please enable Location in Browser Settings.";
                        else if(err.code === 3) errorLog.innerText = "❌ GPS Timeout. Please go near a window or outside.";
                        else errorLog.innerText = "❌ GPS Error: " + err.message;
                    },
                    { 
                        enableHighAccuracy: true, // Sabse accurate location ke liye
                        maximumAge: 0, 
                        timeout: 15000 
                    }
                );
            } else {
                alert("Mobile doesn't support GPS tracking.");
            }
        } else {
            // Stop logic
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            startBtn.style.display = "block";
            stopBtn.style.display = "none";
            liveStatus.innerText = "Trip Ended Successfully";
            activeIndicator.style.display = "none";
            document.getElementById("last-coords").innerText = "None";
        }
    }

    function logout() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        localStorage.removeItem("driverLogin");
        window.location.href = "driverlogin.html";
    }
    </script>
</body>
</html>
