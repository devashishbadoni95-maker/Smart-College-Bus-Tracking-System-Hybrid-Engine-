<!DOCTYPE html>
<html>
<head>
    <title>Student View - Shivalik College Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; background: #f8fafc; }
        #map { height: 75vh; width: 100%; display: none; }
        .info-panel {
            padding: 15px; background: #1e293b; color: white;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #334155; color: white; font-weight: 600; width: 100%; outline: none; }
        .status-badge { background: #64748b; color: white; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; text-align: center; }
        #eta-box { font-size: 15px; text-align: center; font-weight: 500; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .selection-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .selection-card { background: white; padding: 40px 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 360px; }
        .leaflet-marker-icon { transition: transform 0.5s linear !important; }
    </style>
</head>

<body>

<div id="selection-screen" class="selection-overlay">
    <div class="selection-card">
        <h2>🚌 Select Your Bus</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Choose the bus you want to track</p>
        <select id="initial-bus-select">
            <option value="BUS-01">Bus No. 1 (Route A)</option>
            <option value="BUS-02">Bus No. 2 (Route B)</option>
        </select>
        <button class="logout-btn" style="background:#2563eb; margin-top:25px;" onclick="initTracking()">Start Tracking</button>
    </div>
</div>

<div id="ui-container" style="display: none;">
    <div class="info-panel">
        <div>
            <select id="stop-selector" onchange="setCustomStop()">
                <option value="">-- Set Alert Stop --</option>
                <option value="30.298077,78.068759">Ambiwala Gurudwara</option>
                <option value="30.2883,78.0234">Kargi Chowk</option>
                <option value="30.295770,78.056032">Rispana Pull</option>
                <option value="30.278211,77.989961">Chandrabani Chowk</option>
                <option value="30.296627,77.996641">Bansal Home</option>
                <option value="30.286559,77.995634">Turner Road</option> 
            </select>
        </div>
        <div>
            <div id="status" class="status-badge">Searching for Bus...</div>
        </div>
        <div id="eta-box">
             🕒 <span id="bus-name-display">BUS-01</span> ETA: <span id="eta" style="color:#fbbf24; font-weight:bold;">-- mins</span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>
    const socket = io();
    let map, busMarker, routingControl;
    let selectedBusId = "BUS-01";
    
    // Shivalik College of Engineering, Selaqui [Latitude, Longitude]
    const collegeLoc = [30.336050, 77.870357]; 
    const myUsername = localStorage.getItem("studentUser") || "student01";

    // 🔑 AAPKI MAPTILER FREE API KEY MERGED
    const MAPTILER_KEY = 'L9iSkXIIdHVQHD9HPMwA';

    function initTracking() {
        selectedBusId = document.getElementById("initial-bus-select").value;
        document.getElementById("bus-name-display").innerText = selectedBusId;
        document.getElementById("selection-screen").style.display = "none";
        document.getElementById("ui-container").style.display = "block";
        document.getElementById("map").style.display = "block";
        setupMap();
    }

    function setupMap() {
        map = L.map('map').setView(collegeLoc, 13);
        
        // 🔥 MapTiler Traffic/Sport Layer Linked with your verified key
        L.tileLayer(`https://api.maptiler.com/maps/basic-v2-sport/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`).addTo(map);

        L.marker(collegeLoc).addTo(map).bindPopup("🏫 Shivalik College (Selaqui)").openPopup();
        
        const busIcon = L.icon({ 
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png', 
            iconSize: [45, 45], iconAnchor: [22, 22]
        });
        busMarker = L.marker([0, 0], { icon: busIcon }).addTo(map);
    }

    socket.on("bus-moved", (data) => {
        if (data.busId === selectedBusId) {
            const { lat, lng } = data;
            
            if (busMarker.getLatLng().lat === 0) {
                busMarker.setLatLng([lat, lng]);
                map.setView([lat, lng], 14);
            } else {
                busMarker.setLatLng([lat, lng]);
            }
            
            document.getElementById("status").innerText = selectedBusId + " is LIVE 🟢";
            document.getElementById("status").style.background = "#22c55e";

            // 🔥 OSRM Dynamic Routing Matrix (Adaptive Road Pinned)
            if (routingControl) map.removeControl(routingControl);
            routingControl = L.Routing.control({
                waypoints: [L.latLng(lat, lng), L.latLng(collegeLoc[0], collegeLoc[1])],
                createMarker: () => null,
                lineOptions: { styles: [{ color: '#2563eb', weight: 6, opacity: 0.8 }] },
                addWaypoints: false, draggableWaypoints: false, show: false
            }).on('routesfound', (e) => {
                document.getElementById('eta').innerText = Math.round(e.routes[0].summary.totalTime / 60) + " mins";
            }).addTo(map);
        }
    });

    function setCustomStop() {
        const val = document.getElementById("stop-selector").value;
        if (!val) return;
        const [lat, lng] = val.split(",").map(Number);
        L.marker([lat, lng]).addTo(map).bindPopup("My Stop").openPopup();
        L.circle([lat, lng], { color: 'red', radius: 400 }).addTo(map);
        socket.emit('student-set-stop', { id: myUsername, stop: document.getElementById("stop-selector").selectedOptions[0].text, busSelected: selectedBusId });
        document.getElementById("stop-selector").disabled = true;
        alert("Stop Locked to " + selectedBusId);
    }

    function logout() { localStorage.clear(); window.location.href = "studentlogin.html"; }
</script>
</body>
</html>
