<!DOCTYPE html>
<html>
<head>
    <title>Student View - Shivalik College Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; background: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
        #map { height: 75vh; width: 100%; display: none; position: relative; }
        
        .info-panel {
            padding: 15px; background: #1e293b; color: white;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #334155; color: white; font-weight: 600; width: 100%; outline: none; }
        .status-badge { background: #64748b; color: white; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; text-align: center; }
        #eta-box { font-size: 15px; text-align: center; font-weight: 500; line-height: 1.4; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        
        .selection-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .selection-card { background: white; padding: 40px 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 360px; }
        .leaflet-marker-icon { transition: transform 0.5s linear !important; }

        /* 🔥 PREMIUM TOP GEOFENCING NOTIFICATION MODAL (Slide Down Animation) */
        .alert-modal { 
            position: fixed; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%) translateY(-150%); 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            padding: 16px 24px; 
            border-left: 6px solid #ea580c; 
            z-index: 10000; 
            color: #1e293b;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .alert-modal.active { transform: translateX(-50%) translateY(0); }
        .alert-icon { font-size: 28px; animation: pulse 1.5s infinite; }
        .alert-content h4 { font-size: 16px; color: #0f172a; font-weight: 700; text-align: left; }
        .alert-content p { font-size: 13px; color: #64748b; margin-top: 2px; text-align: left; }
        .alert-close { background: #f1f5f9; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; margin-left: 10px; color: #0f172a; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    </style>
</head>

<body>

<div id="selection-screen" class="selection-overlay">
    <div class="selection-card">
        <h2>🚌 Select Your Bus</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Choose the bus you want to track</p>
        <select id="initial-bus-select">
            <option value="BUS-01">Bus No. 1 (Route A)</option>
            <option value="BUS-02">Bus No. 2 (Route B)</option>
        </select>
        <button class="logout-btn" style="background:#2563eb; margin-top:25px;" onclick="initTracking()">Start Tracking</button>
    </div>
</div>

<div id="ui-container" style="display: none; flex: 1; display: flex; flex-direction: column;">
    <div class="info-panel">
        <div>
            <select id="stop-selector" onchange="setCustomStop()">
                <option value="">-- Set Alert Stop --</option>
                <option value="30.298077,78.068759">Ambiwala Gurudwara</option>
                <option value="30.2883,78.0234">Kargi Chowk</option>
                <option value="30.295770,78.056032">Rispana Pull</option>
                <option value="30.278211,77.989961">Chandrabani Chowk</option>
                <option value="30.296627,77.996641">Bansal Home</option>
                <option value="30.286559,77.995634">Turner Road</option> 
            </select>
        </div>
        <div>
            <div id="status" class="status-badge">Searching for Bus...</div>
        </div>
        <div id="eta-box">
             🕒 <span id="bus-name-display">BUS-01</span> ETA: <span id="eta" style="color:#fbbf24; font-weight:bold;">-- mins</span>
             <div id="speed-display" style="font-size: 13px; color: #94a3b8; margin-top: 3px;">Speed: <span id="speedVal" style="color:#16a34a; font-weight:bold;">0 km/h</span></div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div id="map" style="flex: 1;"></div>
</div>

<div id="geofenceAlert" class="alert-modal">
    <div class="alert-icon">🚨</div>
    <div class="alert-content">
        <h4>Bus Approaching!</h4>
        <p id="alertDetails">Your vehicle is within 500 meters of the stop zone.</p>
    </div>
    <button class="alert-close" onclick="silenceAlertModal()">Dismiss</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>
    const socket = io();
    let map, busMarker, stopMarker, routingControl;
    let selectedBusId = "BUS-01";
    
    // ✅ EXACT FIXED SHIVALIK COLLEGE COORDINATES
    const collegeLoc = [30.336050, 77.870357]; 
    const myUsername = localStorage.getItem("studentUser") || "student01";
    
    let alertTriggered = false;
    let selectedStopLat = null;
    let selectedStopLng = null;
    let selectedStopName = "";

    // Mixkit Standard Clear Ringtone Sound Chime integration
    const notificationSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-84.wav");

    function initTracking() {
        selectedBusId = document.getElementById("initial-bus-select").value;
        document.getElementById("bus-name-display").innerText = selectedBusId;
        document.getElementById("selection-screen").style.display = "none";
        
        // Flexbox view fix handles
        const uiContainer = document.getElementById("ui-container");
        uiContainer.style.display = "flex";
        document.getElementById("map").style.display = "block";
        
        setupMap();
        
        // Notify backend server to request dedicated bus telemetry room stream channel
        socket.emit("request-bus-stream", selectedBusId);
    }

    function setupMap() {
        map = L.map('map').setView(collegeLoc, 12);
        
        // ✅ OpenStreetMap Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // ✅ Add Shivalik College Permanent Marker Location Hub
        const collegeIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/8074/8074788.png',
            iconSize: [40, 40],
            iconAnchor: [20, 40]
        });
        L.marker(collegeLoc, {icon: collegeIcon}).addTo(map).bindPopup("<b>🏫 Shivalik College of Engineering</b><br>Selaqui, Dehradun").openPopup();
        
        // Initialize dynamic moving bus token marker placeholder
        const busIcon = L.icon({ 
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png', 
            iconSize: [45, 45], iconAnchor: [22, 22]
        });
        busMarker = L.marker([0, 0], { icon: busIcon }).addTo(map);
    }

    // 🛰️ LIVE BROADCAST STREAM NETWORKS TRIGGER LAYER
    // Driver se direct coordinate trigger updates catch karne wala main pipeline wrapper
    socket.on("bus-moved", (data) => {
        handleBusTelemetryUpdate(data);
    });

    socket.on("bus-telemetry-stream", (data) => {
        handleBusTelemetryUpdate(data);
    });

    function handleBusTelemetryUpdate(data) {
        if (data.busId === selectedBusId) {
            const { lat, lng, speed } = data;
            const currentSpeed = speed ? Math.round(speed) : 0;
            
            // Live Speed display interface counter update
            document.getElementById("speedVal").innerText = `${currentSpeed} km/h`;
            
            if (busMarker.getLatLng().lat === 0) {
                busMarker.setLatLng([lat, lng]);
                map.setView([lat, lng], 14);
            } else {
                busMarker.setLatLng([lat, lng]);
            }
            
            document.getElementById("status").innerText = selectedBusId + " is LIVE 🟢";
            document.getElementById("status").style.background = "#22c55e";

            // Leaflet OSRM Route Line Vector Processing
            if (routingControl) map.removeControl(routingControl);
            routingControl = L.Routing.control({
                waypoints: [L.latLng(lat, lng), L.latLng(collegeLoc[0], collegeLoc[1])],
                createMarker: () => null,
                lineOptions: { styles: [{ color: '#2563eb', weight: 6, opacity: 0.8 }] },
                addWaypoints: false, draggableWaypoints: false, show: false
            }).on('routesfound', (e) => {
                document.getElementById('eta').innerText = Math.round(e.routes[0].summary.totalTime / 60) + " mins";
            }).addTo(map);

            // Live 500 Meters Safety Radar Scanner Execution Check
            if (selectedStopLat && selectedStopLng) {
                const distanceToStop = calculateHaversineDistance(lat, lng, selectedStopLat, selectedStopLng);
                if (distanceToStop <= 0.500 && !alertTriggered) { // 0.500 KM equals 500 Meters standard range
                    triggerGeofenceAlert(Math.round(distanceToStop * 1000));
                } else if (distanceToStop > 0.600) {
                    alertTriggered = false; // Reset lock gateway once vehicle moves past safety perimeter
                }
            }
        }
    }

    function setCustomStop() {
        const val = document.getElementById("stop-selector").value;
        if (!val) return;
        
        const selectedOption = document.getElementById("stop-selector").selectedOptions[0];
        selectedStopName = selectedOption.text;
        
        // Destructure and split option string array array elements
        const [lat, lng] = val.split(",").map(Number);
        selectedStopLat = lat;
        selectedStopLng = lng;
        alertTriggered = false; // Reset custom trigger locks

        // Render Stop Marker pin layout setup
        if (stopMarker) map.removeLayer(stopMarker);
        
        const stopIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/2776/2776067.png',
            iconSize: [35, 35],
            iconAnchor: [17, 35]
        });
        
        stopMarker = L.marker([lat, lng], {icon: stopIcon}).addTo(map);
        stopMarker.bindPopup(`<b>Your Pickup Point:</b><br>${selectedStopName}`).openPopup();
        L.circle([lat, lng], { color: 'red', fillColor: '#f03', fillOpacity: 0.15, radius: 500 }).addTo(map);
        
        // Emit transaction update ledger payload packets directly to database engine
        socket.emit('student-set-stop', { 
            id: myUsername, 
            stop: selectedStopName, 
            busSelected: selectedBusId 
        });
        
        document.getElementById("stop-selector").disabled = true;
        alert(`🎯 Target stop securely locked to: ${selectedStopName}`);
    }

    // Haversine Blueprint for Precision Radar Scans
    function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }

    function triggerGeofenceAlert(meters) {
        alertTriggered = true;
        document.getElementById("alertDetails").innerText = `Vehicle ${selectedBusId.toUpperCase()} is just ${meters} meters away from your stop (${selectedStopName})!`;
        document.getElementById("geofenceAlert").classList.add("active");
        
        notificationSound.play().catch(e => console.log("Audio pipeline autoplay blocker bypass context logged:", e));
    }

    function silenceAlertModal() {
        document.getElementById("geofenceAlert").classList.remove("active");
    }

    function logout() { localStorage.clear(); window.location.href = "studentlogin.html"; }
</script>
</body>
</html>
