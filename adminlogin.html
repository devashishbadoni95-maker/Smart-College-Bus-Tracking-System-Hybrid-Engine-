<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - College Bus</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e293b; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .error { color: #ef4444; font-size: 14px; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>👨‍✈️ Admin Portal</h2>
        <input type="text" id="user" placeholder="Admin Username">
        <input type="password" id="pass" placeholder="Admin Password">
        <button onclick="adminLogin()">Login to Dashboard</button>
        <p id="err" class="error">❌ Invalid Admin Credentials</p>
    </div>

    <script>
        async function adminLogin() {
            const u = document.getElementById("user").value;
            const p = document.getElementById("pass").value;
            
            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: u, password: p, role: "admin" })
            });

            const data = await res.json();
            if (data.success) {
                localStorage.setItem("adminLogin", "true");
                location.href = "admin.html";
            } else {
                document.getElementById("err").style.display = "block";
            }
        }
    </script>
</body>
</html>
