<!DOCTYPE html>
<html>
<head>
    <title>Student Login - College Bus</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .icon-circle { font-size: 50px; margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #2980b9; }
        .error-msg { color: #e74c3c; font-size: 14px; display: none; margin-top: 10px; padding: 8px; background: #fdf2f2; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon-circle">🎓</div>
        <h2>Student Login</h2>
        
        <div class="input-group">
            <input type="text" id="u" placeholder="Username (student01)" required>
        </div>
        <div class="input-group">
            <input type="password" id="p" placeholder="Password (std@123)" required>
        </div>

        <button type="button" id="loginBtn" onclick="login()">Access Map</button>
        <p id="error" class="error-msg"></p>
    </div>

    <script>
    const SESSION_DURATION = 30 * 60 * 1000; 

    // Page load hote hi session check karein
    window.onload = function() {
        const isLoggedIn = localStorage.getItem("studentLogin");
        const loginTime = localStorage.getItem("loginTime");
        const currentTime = new Date().getTime();

        if (isLoggedIn === "true" && loginTime) {
            if (currentTime - loginTime < SESSION_DURATION) {
                window.location.href = "student.html";
            } else {
                localStorage.clear();
            }
        }
    };

    async function login() {
        const u = document.getElementById("u").value.trim();
        const p = document.getElementById("p").value.trim();
        const errorMsg = document.getElementById("error");
        const btn = document.getElementById("loginBtn");

        if (!u || !p) {
            errorMsg.style.display = "block";
            errorMsg.innerText = "⚠️ Please fill all fields";
            return;
        }

        errorMsg.style.display = "none";
        btn.innerText = "Checking...";
        btn.disabled = true;

        try {
            // Render URL structure ke hisaab se fetch
            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    username: u, 
                    password: p, 
                    role: "student" 
                })
            });

            const data = await res.json();

            if (data.success) {
                localStorage.setItem("studentLogin", "true");
                localStorage.setItem("loginTime", new Date().getTime());
                localStorage.setItem("studentUser", u);
                
                window.location.href = "student.html";
            } else {
                btn.innerText = "Access Map";
                btn.disabled = false;
                errorMsg.style.display = "block";
                errorMsg.innerText = "❌ " + (data.message || "Invalid Details");
            }
        } catch (err) {
            btn.innerText = "Access Map";
            btn.disabled = false;
            errorMsg.style.display = "block";
            errorMsg.innerText = "⚠️ Connection Error. Check if server is running.";
            console.error("Login Error:", err);
        }
    }

    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { login(); }
    });
    </script>
</body>
</html>
