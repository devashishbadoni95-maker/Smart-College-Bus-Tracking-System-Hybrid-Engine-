<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login - Transit Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #ffffff; 
            height: 100vh; 
            display: flex;
            overflow: hidden;
        }

        /* Split View Setup */
        .login-split-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Branding Panel Left Side (Driver/Operator Theme - Orange/Amber gradient) */
        .branding-panel {
            flex: 1.2;
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            color: white;
            position: relative;
        }
        .branding-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
        }
        .panel-icon { font-size: 70px; margin-bottom: 20px; }
        .branding-panel h1 { font-size: 42px; font-weight: 800; margin-bottom: 15px; letter-spacing: -0.5px; }
        .branding-panel p { color: #ffedd5; font-size: 16px; max-width: 450px; line-height: 1.6; }

        /* Form Panel Right Side */
        .form-panel {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: #ffffff;
            box-shadow: -10px 0 30px rgba(0,0,0,0.02);
        }
        .form-container-box {
            width: 100%;
            max-width: 380px;
        }
        .form-container-box h2 {
            color: #1e293b;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        /* Dynamic subtitle managed by socket */
        #clg-subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 35px;
        }

        /* Premium Form Controls */
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            font-size: 15px; 
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #0f172a;
        }
        .input-group input:focus { border-color: #ea580c; background: #ffffff; box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.1); }
        
        button { 
            width: 100%; 
            padding: 14px; 
            background: #ea580c; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            transition: all 0.2s ease; 
            font-weight: 600; 
            margin-top: 5px;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
        }
        button:hover { background: #d97706; transform: translateY(-1px); }
        button:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .error-msg { 
            color: #dc2626; 
            font-size: 14px; 
            display: none; 
            margin-top: 15px; 
            padding: 12px; 
            background: #fef2f2; 
            border-radius: 8px; 
            font-weight: 500;
            border-left: 4px solid #dc2626;
        }
        .btn-home {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            margin-top: 20px;
            transition: color 0.2s;
        }
        .btn-home:hover { color: #1e293b; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .login-split-container { flex-direction: column; }
            .branding-panel { flex: none; padding: 40px 20px; text-align: center; align-items: center; }
            .branding-panel h1 { font-size: 28px; }
            .panel-icon { font-size: 50px; }
            .form-panel { flex: 1; padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="login-split-container">
        <div class="branding-panel">
            <div class="panel-icon">👨‍✈️</div>
            <h1>Driver Console</h1>
            <p>Initialize your trip route, stream real-time GPS telemetry coordinates safely, and broadcast automated ETA updates to waiting passengers.</p>
        </div>

        <div class="form-panel">
            <div class="form-container-box">
                <h2>Operator Terminal</h2>
                <p id="clg-subtitle">Connecting to fleet authentication network...</p>
                
                <div class="input-group">
                    <input type="text" id="driverUser" placeholder="Driver ID (e.g., driver01)" required>
                </div>
                <div class="input-group">
                    <input type="password" id="driverPass" placeholder="Security Access Password" required>
                </div>
                
                <button type="button" id="loginBtn" onclick="driverLogin()">Initialize Navigation System</button>
                
                <a href="/" class="btn-home">⬅️ Return to Main Gateway</a>
                <p id="err" class="error-msg"></p>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // 🔒 AUTO-REDIRECT GUARD: Agar driver pehle se logged-in hai, toh bina wajah login screen mat dikhao
        if (localStorage.getItem("driverLogin") === "true" && localStorage.getItem("driverUser")) {
            window.location.replace("driver.html");
        }

        const socket = io();

        // 🔥 LIVE COLLEGE NAME LISTENER
        socket.on("update-college-name", (collegeName) => {
            document.getElementById("clg-subtitle").innerText = `${collegeName} Transit Operations`;
            document.title = `Driver Login - ${collegeName}`;
        });

        async function driverLogin() {
            const u = document.getElementById("driverUser").value.trim();
            const p = document.getElementById("driverPass").value.trim();
            const errEl = document.getElementById("err");
            const btn = document.getElementById("loginBtn");

            if (!u || !p) {
                errEl.style.display = "block";
                errEl.innerText = "⚠️ Driver ID and Password parameters are mandatory.";
                return;
            }

            errEl.style.display = "none";
            btn.innerText = "Authenticating Operator Profile...";
            btn.disabled = true;

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: u, password: p, role: "driver" })
                });

                const data = await res.json();

                if (data.success) {
                    // 🔒 Real-time backend setup data storage (No hardcoded fallback here)
                    localStorage.setItem("driverLogin", "true");
                    localStorage.setItem("userRole", "driver");
                    localStorage.setItem("driverUser", u);
                    localStorage.setItem("assignedBus", data.assignedBus);
                    
                    window.location.replace("driver.html");
                } else {
                    btn.innerText = "Initialize Navigation System";
                    btn.disabled = false;
                    errEl.style.display = "block";
                    errEl.innerText = "❌ " + (data.message || "Invalid Driver Credentials.");
                }
            } catch (err) {
                btn.innerText = "Initialize Navigation System";
                btn.disabled = false;
                errEl.style.display = "block";
                errEl.innerText = "⚠️ Network timeout during cryptographic check.";
            }
        }

        // Enter key support for smooth login
        document.addEventListener('keypress', (e) => { if (e.key === 'Enter') driverLogin(); });
    </script>
</body>
</html>
